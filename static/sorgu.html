<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parsel Sorgulama - Arsaya Dair</title>

  <!-- Leaflet Harita CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Sol Menü */
    .sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 340px;
      max-height: calc(100vh - 32px);
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      background: #0f172a;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sidebar-content {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-badge {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12.5px;
      font-weight: 600;
      color: #475569;
    }
    .form-control {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13.5px;
      color: #1e293b;
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .btn-primary {
      background: #dc2626;
      color: #ffffff;
      border: none;
      height: 42px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #b91c1c;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      height: 36px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Parsel Üzerindeki Ada / Parsel Etiketi */
    .parcel-label {
      background: rgba(15, 23, 42, 0.9) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      border-radius: 6px !important;
      font-weight: 700 !important;
      font-size: 12.5px !important;
      padding: 4px 10px !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5) !important;
      white-space: nowrap !important;
      text-align: center !important;
      line-height: 1.35 !important;
      pointer-events: none !important;
    }
    .leaflet-tooltip-pane .parcel-label::before {
      border-top-color: rgba(15, 23, 42, 0.9) !important;
    }

    /* Popup Tasarımı */
    .tkgm-popup {
      font-size: 13px;
      min-width: 210px;
      padding: 2px 0;
    }
    .tkgm-popup-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 3px;
    }
    .tkgm-popup-row span {
      color: #64748b;
    }
    .tkgm-popup-row b {
      color: #0f172a;
    }
    .tkgm-popup-btn {
      width: 100%;
      margin-top: 8px;
      background: #059669;
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Parsel Detay Kartı (Modal) */
    #detailModal {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 1000;
      display: none;
      overflow: hidden;
    }
    #detailModal .modal-header {
      background: #0f172a;
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 700;
    }
    #detailModal .modal-body {
      padding: 14px 16px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Sol Menü -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Parsel Sorgulama</h2>
      <span style="font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 6px; color: #38bdf8;">TKGM Entegre</span>
    </div>

    <div class="sidebar-content">
      <div class="info-badge">
        💡 <b>İpucu:</b> Harita üzerinde herhangi bir arsaya tıklayarak ada/parsel sınırlarını doğrudan görebilirsiniz.
      </div>

      <!-- İl -->
      <div class="form-group">
        <label for="ilSelect">İl</label>
        <select id="ilSelect" class="form-control">
          <option value="">İl Seçiniz..</option>
        </select>
      </div>

      <!-- İlçe -->
      <div class="form-group">
        <label for="ilceSelect">İlçe</label>
        <select id="ilceSelect" class="form-control" disabled>
          <option value="">Önce İl Seçiniz</option>
        </select>
      </div>

      <!-- Mahalle -->
      <div class="form-group">
        <label for="mahalleSelect">Mahalle</label>
        <select id="mahalleSelect" class="form-control" disabled>
          <option value="">Önce İlçe Seçiniz</option>
        </select>
      </div>

      <!-- Ada / Parsel -->
      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label for="adaInput">Ada</label>
          <input type="text" id="adaInput" class="form-control" placeholder="Örn: 101" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="parselInput">Parsel</label>
          <input type="text" id="parselInput" class="form-control" placeholder="Örn: 5" />
        </div>
      </div>

      <button id="btnSorgula" class="btn-primary">
        <span>🔍</span> Parseli Sorgula
      </button>

      <button id="btnClear" class="btn-secondary">
        Haritadaki Parselleri Temizle
      </button>
    </div>
  </div>

  <!-- Detay Kartı (Modal) -->
  <div id="detailModal">
    <div class="modal-header">
      <span>Parsel Detay Bilgileri</span>
      <span style="cursor: pointer;" onclick="document.getElementById('detailModal').style.display='none'">✕</span>
    </div>
    <div class="modal-body" id="detailModalBody"></div>
  </div>

  <!-- Harita -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Haritayı Başlat
    const map = L.map('map', {
      zoomControl: false
    }).setView([39.0, 35.2], 6);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Uydu ve Sokak Katmanları
    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Uydu'
    }).addTo(map);

    const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'OpenStreetMap'
    });

    L.control.layers({
      "Uydu Görüntüsü (Hibrit)": googleSatellite,
      "Sokak Haritası": osmStreet
    }, null, { position: 'topright' }).addTo(map);

    // Çizim Katmanları
    const adminBoundaryGroup = L.featureGroup().addTo(map); // İl / İlçe / Mahalle Sınırları
    const parcelLayerGroup = L.featureGroup().addTo(map);   // Parseller
    const drawnParcelsMap = new Map(); // Çift eklemeyi engellemek için hafıza
    let clickMarker = null;

    // Veri Havuzları
    let illerList = [];
    let ilcelerList = [];
    let mahallelerList = [];

    // Elementler
    const ilSelect = document.getElementById('ilSelect');
    const ilceSelect = document.getElementById('ilceSelect');
    const mahalleSelect = document.getElementById('mahalleSelect');
    const adaInput = document.getElementById('adaInput');
    const parselInput = document.getElementById('parselInput');
    const btnSorgula = document.getElementById('btnSorgula');
    const btnClear = document.getElementById('btnClear');
    const detailModal = document.getElementById('detailModal');
    const detailModalBody = document.getElementById('detailModalBody');

    // 2. DÜZ ÇİZGİLİ İdari Sınır Çizme Fonksiyonu
    function showAdminBoundary(geom, maxZoom) {
      if (!geom) return;
      try {
        adminBoundaryGroup.clearLayers(); // Önceki idari sınırı kaldır
        
        const boundaryLayer = L.geoJSON(geom, {
          style: {
            color: '#2563eb',       // Net Mavi DÜZ Sınır Çizgisi
            weight: 3,
            opacity: 0.95,
            fillColor: '#3b82f6',   // Çok hafif mavi dolgu
            fillOpacity: 0.05
          }
        });

        adminBoundaryGroup.addLayer(boundaryLayer);

        map.flyToBounds(boundaryLayer.getBounds(), {
          padding: [30, 30],
          maxZoom: maxZoom || 16,
          duration: 1.2
        });
      } catch (e) {
        console.error('Sınır çizme hatası:', e);
      }
    }

    // 3. İlleri Getir
    async function loadIller() {
      try {
        const res = await fetch('/api/iller');
        if (!res.ok) throw new Error();
        illerList = await res.json();
        
        ilSelect.innerHTML = '<option value="">İl Seçiniz..</option>';
        illerList.forEach(il => {
          const opt = document.createElement('option');
          opt.value = il.id;
          opt.textContent = il.ad;
          ilSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('İller yüklenemedi:', err);
      }
    }
    loadIller();

    // 4. İl Seçimi -> Düz Sınır Çiz & Yakınlaş
    ilSelect.addEventListener('change', async () => {
      const ilId = ilSelect.value;
      ilceSelect.innerHTML = '<option value="">Yükleniyor...</option>';
      ilceSelect.disabled = true;
      mahalleSelect.innerHTML = '<option value="">Önce İlçe Seçiniz</option>';
      mahalleSelect.disabled = true;

      if (!ilId) {
        ilceSelect.innerHTML = '<option value="">Önce İl Seçiniz</option>';
        adminBoundaryGroup.clearLayers();
        return;
      }

      const seciliIl = illerList.find(i => i.id == ilId);
      if (seciliIl && seciliIl.geometry) {
        showAdminBoundary(seciliIl.geometry, 10);
      }

      try {
        const res = await fetch(`/api/ilceler/${ilId}`);
        if (!res.ok) throw new Error();
        ilcelerList = await res.json();

        ilceSelect.innerHTML = '<option value="">İlçe Seçiniz..</option>';
        ilcelerList.forEach(ilce => {
          const opt = document.createElement('option');
          opt.value = ilce.id;
          opt.textContent = ilce.ad;
          ilceSelect.appendChild(opt);
        });
        ilceSelect.disabled = false;
      } catch (err) {
        ilceSelect.innerHTML = '<option value="">İlçeler alınamadı</option>';
      }
    });

    // 5. İlçe Seçimi -> Düz Sınır Çiz & Yakınlaş
    ilceSelect.addEventListener('change', async () => {
      const ilceId = ilceSelect.value;
      mahalleSelect.innerHTML = '<option value="">Yükleniyor...</option>';
      mahalleSelect.disabled = true;

      if (!ilceId) {
        mahalleSelect.innerHTML = '<option value="">Önce İlçe Seçiniz</option>';
        return;
      }

      const seciliIlce = ilcelerList.find(i => i.id == ilceId);
      if (seciliIlce && seciliIlce.geometry) {
        showAdminBoundary(seciliIlce.geometry, 13);
      }

      try {
        const res = await fetch(`/api/mahalleler/${ilceId}`);
        if (!res.ok) throw new Error();
        mahallelerList = await res.json();

        mahalleSelect.innerHTML = '<option value="">Mahalle Seçiniz..</option>';
        mahallelerList.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.ad;
          mahalleSelect.appendChild(opt);
        });
        mahalleSelect.disabled = false;
      } catch (err) {
        mahalleSelect.innerHTML = '<option value="">Mahalleler alınamadı</option>';
      }
    });

    // 6. Mahalle Seçimi -> Düz Sınır Çiz & Yakınlaş
    mahalleSelect.addEventListener('change', () => {
      const mahalleId = mahalleSelect.value;
      if (!mahalleId) return;

      const seciliMahalle = mahallelerList.find(m => m.id == mahalleId);
      if (seciliMahalle && seciliMahalle.geometry) {
        showAdminBoundary(seciliMahalle.geometry, 15);
      }
    });

    // 7. Parseli Haritaya Çizme (Mükerrer Eklemeyi Önleyen ve Parselleri Koruyan Mantık)
    function renderParcel(geojson, shouldFly = false) {
      if (!geojson) return null;

      const features = geojson.features || (geojson.geometry ? [geojson] : []);
      if (features.length === 0) return null;

      const target = features[0] || geojson;
      const props = target.properties || {};

      const ada = props.adaNo || props.ada || '0';
      const parsel = props.parselNo || props.parsel || '';
      const alan = props.alan || props.yuzolcumu || '';
      const mahalle = props.mahalleAd || props.mahalle || '';

      // Parsel için benzersiz kimlik (örn: Kurtkoy_4014_3)
      const parcelKey = `${mahalle}_${ada}_${parsel}`;

      // Bu parsel haritada zaten varsa tekrar ekleyip üst üste bindirme!
      if (drawnParcelsMap.has(parcelKey)) {
        return props;
      }

      const layer = L.geoJSON(geojson, {
        style: {
          color: '#dc2626',       // Canlı Kırmızı Sınır (TKGM Stili)
          weight: 3.5,
          opacity: 1,
          fillColor: '#ef4444',   // Şeffaf Kırmızı Dolgu
          fillOpacity: 0.22
        }
      });

      // Parselin Ortasına Sabit Etiket
      if (parsel) {
        let labelHtml = `<b>${ada} / ${parsel}</b>`;
        if (alan) {
          const formattedAlan = Number(alan).toLocaleString('tr-TR');
          labelHtml += `<br><span style="font-size: 11px; font-weight: 500; color: #cbd5e1;">${formattedAlan} m²</span>`;
        }

        layer.bindTooltip(labelHtml, {
          permanent: true,
          direction: 'center',
          className: 'parcel-label'
        }).openTooltip();
      }

      layer.on('click', () => {
        window.showParcelDetails(props);
      });

      parcelLayerGroup.addLayer(layer);
      drawnParcelsMap.set(parcelKey, layer);

      // Sadece arama butonuna basıldığında kamerayı uçur (Harita tıklamasında ekran kaymasın)
      if (shouldFly) {
        map.flyToBounds(layer.getBounds(), {
          padding: [60, 60],
          maxZoom: 19,
          duration: 1.2
        });
      }

      return props;
    }

    // 8. Parsel Detay Kartını Açma
    window.showParcelDetails = function(p) {
      detailModalBody.innerHTML = `
        <div class="tkgm-popup-row"><span>İl / İlçe:</span><b>${p.ilAd || '-'} / ${p.ilceAd || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Mahalle:</span><b>${p.mahalleAd || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Ada / Parsel:</span><b style="color: #dc2626;">${p.adaNo || p.ada || '0'} / ${p.parselNo || p.parsel || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Alan:</span><b>${p.alan || p.yuzolcumu ? Number(p.alan || p.yuzolcumu).toLocaleString('tr-TR') + ' m²' : '-'}</b></div>
        <div class="tkgm-popup-row"><span>Nitelik:</span><b>${p.nitelik || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Mevkii:</span><b>${p.mevki || p.mevkii || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Pafta:</span><b>${p.pafta || '-'}</b></div>
      `;
      detailModal.style.display = 'block';
    };

    // 9. Arama Butonundan Sorgulama (Burada kamerayı parsele uçuruyoruz)
    btnSorgula.addEventListener('click', async () => {
      const mahalleId = mahalleSelect.value;
      const ada = adaInput.value.trim() || '0';
      const parsel = parselInput.value.trim();

      if (!mahalleId || !parsel) {
        alert('Lütfen Mahalle ve Parsel numarasını giriniz.');
        return;
      }

      btnSorgula.innerText = 'Sorgulanıyor...';
      btnSorgula.disabled = true;

      try {
        const res = await fetch(`/api/parsel/${mahalleId}/${ada}/${parsel}`);
        if (!res.ok) throw new Error('Parsel bulunamadı');
        const data = await res.json();

        const props = renderParcel(data, true); // true: Kamerayı parsele uçur
        if (props) {
          window.showParcelDetails(props);
        }
      } catch (err) {
        alert('Aradığınız parsel bilgisi bulunamadı veya TKGM yanıt vermedi.');
      } finally {
        btnSorgula.innerText = '🔍 Parseli Sorgula';
        btnSorgula.disabled = false;
      }
    });

    // 10. Haritaya Tıklayarak Parsel Bulma (Kamera zıplaması iptal edildi, sabit kalır)
    map.on('click', async (e) => {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);

      if (clickMarker) map.removeLayer(clickMarker);

      // autoPan: false sayesinde tıklayınca ekran sağa sola kaymaz!
      clickMarker = L.marker(e.latlng).addTo(map);
      clickMarker.bindPopup(`
        <div class="tkgm-popup">
          <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
          <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
          <div style="color: #64748b; font-size: 11px; margin-top: 4px;">Sınırlar tespit ediliyor...</div>
        </div>
      `, { autoPan: false }).openPopup();

      try {
        const res = await fetch(`/api/parsel-nokta/${lat}/${lng}`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        // renderParcel(data, false) -> false olduğu için ekran sabit kalır, zıplamaz
        const props = renderParcel(data, false);
        clickMarker.setPopupContent(`
          <div class="tkgm-popup">
            <div class="tkgm-popup-row"><span>Ada / Parsel:</span><b style="color: #dc2626;">${props.adaNo || props.ada || '0'} / ${props.parselNo || props.parsel || '-'}</b></div>
            <div class="tkgm-popup-row"><span>Mahalle:</span><b>${props.mahalleAd || '-'}</b></div>
            <button class="tkgm-popup-btn" onclick='window.showParcelDetails(${JSON.stringify(props)})'>
              📋 Detayları Görüntüle
            </button>
          </div>
        `).openPopup();
      } catch (err) {
        clickMarker.setPopupContent(`
          <div class="tkgm-popup">
            <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
            <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
            <div style="color: #dc2626; font-size: 11px; margin-top: 4px;">Bu noktada parsel bulunamadı.</div>
          </div>
        `).openPopup();
      }
    });

    // 11. Temizleme Butonu (Tüm parselleri ve hafızayı temizler)
    btnClear.addEventListener('click', () => {
      parcelLayerGroup.clearLayers();
      adminBoundaryGroup.clearLayers();
      drawnParcelsMap.clear();
      if (clickMarker) map.removeLayer(clickMarker);
      detailModal.style.display = 'none';
    });
  </script>
</body>
</html>
