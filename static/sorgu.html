<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Parsel Sorgulama - Arsaya Dair</title>

  <!-- Leaflet Harita CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Sol Menü */
    .sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 340px;
      max-height: calc(100vh - 32px);
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      background: #0f172a;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sidebar-content {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-badge {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12.5px;
      font-weight: 600;
      color: #475569;
    }
    .form-control {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13.5px;
      color: #1e293b;
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .btn-primary {
      background: #dc2626;
      color: #ffffff;
      border: none;
      height: 42px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #b91c1c;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      height: 36px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Parsel Üzerindeki Ada / Parsel Etiketi */
    .parcel-label {
      background: rgba(15, 23, 42, 0.9) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      border-radius: 6px !important;
      font-weight: 700 !important;
      font-size: 12.5px !important;
      padding: 4px 10px !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5) !important;
      white-space: nowrap !important;
      text-align: center !important;
      line-height: 1.35 !important;
      pointer-events: none !important;
    }
    .leaflet-tooltip-pane .parcel-label::before {
      border-top-color: rgba(15, 23, 42, 0.9) !important;
    }

    /* Popup Tasarımı */
    .tkgm-popup {
      font-size: 13px;
      min-width: 210px;
      padding: 2px 0;
    }
    .tkgm-popup-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 3px;
    }
    .tkgm-popup-row span {
      color: #64748b;
    }
    .tkgm-popup-row b {
      color: #0f172a;
    }
    .tkgm-popup-btn {
      width: 100%;
      margin-top: 8px;
      background: #059669;
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Parsel Detay Kartı (Modal) */
    #detailModal {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 350px;
      max-height: 85vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
      overflow-y: auto;
    }
    #detailModal .modal-header {
      background: #0f172a;
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    #detailModal .modal-body {
      padding: 14px 16px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* İndirme Butonları Grubu */
    .export-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1.5px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .export-title {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .export-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .export-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .export-btn-kml {
      background: #e0f2fe;
      color: #0369a1;
      border-color: #bae6fd;
    }
    .export-btn-kml:hover {
      background: #bae6fd;
    }
    .export-btn-txt {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }
    .export-btn-txt:hover {
      background: #e2e8f0;
    }
    .export-btn-dxf {
      grid-column: span 2;
      background: #059669;
      color: #ffffff;
    }
    .export-btn-dxf:hover {
      background: #047857;
    }
    .export-note {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.3;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Sol Menü -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Parsel Sorgulama</h2>
      <span style="font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 6px; color: #38bdf8;">TKGM Canlı</span>
    </div>

    <div class="sidebar-content">
      <div class="info-badge">
        💡 <b>İpucu:</b> Haritada herhangi bir yere tıklayarak ada/parsel sınırlarını anında görebilirsiniz.
      </div>

      <div class="form-group">
        <label for="ilSelect">İl</label>
        <select id="ilSelect" class="form-control">
          <option value="">İl Seçiniz..</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ilceSelect">İlçe</label>
        <select id="ilceSelect" class="form-control" disabled>
          <option value="">Önce İl Seçiniz</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mahalleSelect">Mahalle</label>
        <select id="mahalleSelect" class="form-control" disabled>
          <option value="">Önce İlçe Seçiniz</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label for="adaInput">Ada</label>
          <input type="text" id="adaInput" class="form-control" placeholder="Örn: 101" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="parselInput">Parsel</label>
          <input type="text" id="parselInput" class="form-control" placeholder="Örn: 5" />
        </div>
      </div>

      <button id="btnSorgula" class="btn-primary">
        <span>🔍</span> Parseli Sorgula
      </button>

      <button id="btnClear" class="btn-secondary">
        Haritadaki Parselleri Temizle
      </button>
    </div>
  </div>

  <!-- Detay Kartı (Modal + İndirme Butonları) -->
  <div id="detailModal">
    <div class="modal-header">
      <span>Parsel Detay Bilgileri</span>
      <span style="cursor: pointer; font-size: 16px;" onclick="document.getElementById('detailModal').style.display='none'">✕</span>
    </div>
    <div class="modal-body" id="detailModalBody"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Kullanıcının Doğrudan Kendi IP'siyle Bağlandığı Resmi TKGM v3.1 API'si
    const TKGM_API = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api";

    // 1. Sadece Türkiye ile Sınırlandırılmış Harita
    const turkeyBounds = L.latLngBounds(
      L.latLng(35.0, 25.0),
      L.latLng(42.8, 45.2)
    );

    const map = L.map('map', {
      zoomControl: false,
      maxBounds: turkeyBounds,
      maxBoundsViscosity: 1.0,
      minZoom: 6,
      maxZoom: 20
    }).setView([39.0, 35.2], 6);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Uydu'
    }).addTo(map);

    const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'OpenStreetMap'
    });

    L.control.layers({
      "Uydu Görüntüsü (Hibrit)": googleSatellite,
      "Sokak Haritası": osmStreet
    }, null, { position: 'topright' }).addTo(map);

    const adminBoundaryGroup = L.featureGroup().addTo(map);
    const parcelLayerGroup = L.featureGroup().addTo(map);
    const drawnParcelsMap = new Map();
    let clickMarker = null;

    // Aktif seçili parsel verisi (İndirme işlemleri için)
    let currentActiveParcel = null;
    let lastClickedParcelData = null;

    let illerList = [];
    let ilcelerList = [];
    let mahallelerList = [];

    const ilSelect = document.getElementById('ilSelect');
    const ilceSelect = document.getElementById('ilceSelect');
    const mahalleSelect = document.getElementById('mahalleSelect');
    const adaInput = document.getElementById('adaInput');
    const parselInput = document.getElementById('parselInput');
    const btnSorgula = document.getElementById('btnSorgula');
    const btnClear = document.getElementById('btnClear');
    const detailModal = document.getElementById('detailModal');
    const detailModalBody = document.getElementById('detailModalBody');

    // Türkçe A-Z Sıralama
    function sortTurkish(list) {
      return list.sort((a, b) => (a.ad || a.text || '').localeCompare((b.ad || b.text || ''), 'tr', { sensitivity: 'base' }));
    }

    // Güvenli m² Formatlayıcı (Asla NaN yazmaz)
    function formatAlan(rawAlan) {
      if (!rawAlan) return '';
      let str = String(rawAlan).replace('m²', '').trim();
      if (str.includes(',')) return str;
      let num = parseFloat(str);
      if (!isNaN(num)) {
        return num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return str;
    }

    // 2. DÜZ ÇİZGİLİ İdari Sınır
    function showAdminBoundary(geom, maxZoom) {
      if (!geom) return;
      try {
        adminBoundaryGroup.clearLayers();
        const boundaryLayer = L.geoJSON(geom, {
          style: {
            color: '#2563eb',
            weight: 3,
            opacity: 0.95,
            fillColor: '#3b82f6',
            fillOpacity: 0.05
          }
        });
        adminBoundaryGroup.addLayer(boundaryLayer);
        map.flyToBounds(boundaryLayer.getBounds(), {
          padding: [30, 30],
          maxZoom: maxZoom || 16,
          duration: 1.2
        });
      } catch (e) {
        console.error(e);
      }
    }

    // 3. İlleri Getir (Sunucumuz üzerinden çeker, CORS sorunu yaşanmaz)
    async function loadIller() {
      try {
        const res = await fetch('/api/iller');
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        illerList = sortTurkish(data);
        ilSelect.innerHTML = '<option value="">İl Seçiniz..</option>';
        illerList.forEach(il => {
          const opt = document.createElement('option');
          opt.value = il.id;
          opt.textContent = il.ad;
          ilSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('İller yüklenemedi:', err);
      }
    }
    loadIller();

    // 4. İl Seçimi -> Doğrudan Kullanıcı IP'siyle İlçeleri Çeker
    ilSelect.addEventListener('change', async () => {
      const ilId = ilSelect.value;
      ilceSelect.innerHTML = '<option value="">Yükleniyor...</option>';
      ilceSelect.disabled = true;
      mahalleSelect.innerHTML = '<option value="">Önce İlçe Seçiniz</option>';
      mahalleSelect.disabled = true;

      if (!ilId) {
        ilceSelect.innerHTML = '<option value="">Önce İl Seçiniz</option>';
        adminBoundaryGroup.clearLayers();
        return;
      }

      const seciliIl = illerList.find(i => i.id == ilId);
      if (seciliIl && seciliIl.geometry) {
        showAdminBoundary(seciliIl.geometry, 10);
      }

      try {
        const res = await fetch(`${TKGM_API}/idariYapi/ilceListe/${ilId}`, { referrerPolicy: 'no-referrer' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        const rawIlceler = (data.features || []).map(f => ({
          id: f.properties.id,
          ad: f.properties.text,
          geometry: f.geometry
        }));

        ilcelerList = sortTurkish(rawIlceler);

        ilceSelect.innerHTML = '<option value="">İlçe Seçiniz..</option>';
        ilcelerList.forEach(ilce => {
          const opt = document.createElement('option');
          opt.value = ilce.id;
          opt.textContent = ilce.ad;
          ilceSelect.appendChild(opt);
        });
        ilceSelect.disabled = false;
      } catch (err) {
        ilceSelect.innerHTML = '<option value="">İlçeler alınamadı</option>';
      }
    });

    // 5. İlçe Seçimi -> Doğrudan Kullanıcı IP'siyle Mahalleleri Çeker
    ilceSelect.addEventListener('change', async () => {
      const ilceId = ilceSelect.value;
      mahalleSelect.innerHTML = '<option value="">Yükleniyor...</option>';
      mahalleSelect.disabled = true;

      if (!ilceId) {
        mahalleSelect.innerHTML = '<option value="">Önce İlçe Seçiniz</option>';
        return;
      }

      const seciliIlce = ilcelerList.find(i => i.id == ilceId);
      if (seciliIlce && seciliIlce.geometry) {
        showAdminBoundary(seciliIlce.geometry, 13);
      }

      try {
        const res = await fetch(`${TKGM_API}/idariYapi/mahalleListe/${ilceId}`, { referrerPolicy: 'no-referrer' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        const rawMahalleler = (data.features || []).map(f => ({
          id: f.properties.id,
          ad: f.properties.text,
          geometry: f.geometry
        }));

        mahallelerList = sortTurkish(rawMahalleler);

        mahalleSelect.innerHTML = '<option value="">Mahalle Seçiniz..</option>';
        mahallelerList.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.ad;
          mahalleSelect.appendChild(opt);
        });
        mahalleSelect.disabled = false;
      } catch (err) {
        mahalleSelect.innerHTML = '<option value="">Mahalleler alınamadı</option>';
      }
    });

    // 6. Mahalle Seçimi
    mahalleSelect.addEventListener('change', () => {
      const mahalleId = mahalleSelect.value;
      if (!mahalleId) return;

      const seciliMahalle = mahallelerList.find(m => m.id == mahalleId);
      if (seciliMahalle && seciliMahalle.geometry) {
        showAdminBoundary(seciliMahalle.geometry, 15);
      }
    });

    // 7. Parsel Çizme
    function renderParcel(geojson, shouldFly = false) {
      if (!geojson) return null;

      const features = geojson.features || (geojson.geometry ? [geojson] : []);
      if (features.length === 0) return null;

      const target = features[0] || geojson;
      const props = target.properties || {};

      const ada = props.adaNo || props.ada || '0';
      const parsel = props.parselNo || props.parsel || '';
      const rawAlan = props.alan || props.yuzolcumu || '';
      const mahalle = props.mahalleAd || props.mahalle || '';

      const parcelKey = `${mahalle}_${ada}_${parsel}`;

      if (drawnParcelsMap.has(parcelKey)) {
        return props;
      }

      const layer = L.geoJSON(geojson, {
        style: {
          color: '#dc2626',       // Canlı Kırmızı Sınır
          weight: 3.5,
          opacity: 1,
          fillColor: '#ef4444',   // Şeffaf Kırmızı Dolgu
          fillOpacity: 0.22
        }
      });

      if (parsel) {
        let labelHtml = `<b>${ada} / ${parsel}</b>`;
        const formattedAlan = formatAlan(rawAlan);
        if (formattedAlan) {
          labelHtml += `<br><span style="font-size: 11px; font-weight: 500; color: #cbd5e1;">${formattedAlan} m²</span>`;
        }

        layer.bindTooltip(labelHtml, {
          permanent: true,
          direction: 'center',
          className: 'parcel-label'
        }).openTooltip();
      }

      layer.on('click', () => {
        window.showParcelDetails(props, geojson);
      });

      parcelLayerGroup.addLayer(layer);
      drawnParcelsMap.set(parcelKey, layer);

      if (shouldFly) {
        map.flyToBounds(layer.getBounds(), {
          padding: [60, 60],
          maxZoom: 19,
          duration: 1.2
        });
      }

      return props;
    }

    // 8. Parsel Detay Kartı ve Dışa Aktarma Butonları
    window.showParcelDetails = function(p, geojson) {
      currentActiveParcel = { props: p, geojson: geojson };

      const rawAlan = p.alan || p.yuzolcumu || '';
      const formattedAlan = formatAlan(rawAlan);
      const ada = p.adaNo || p.ada || '0';
      const parsel = p.parselNo || p.parsel || '-';
      const mahalle = p.mahalleAd || '-';
      const ilAd = p.ilAd || '';
      const ilceAd = p.ilceAd || '';

      detailModalBody.innerHTML = `
        <div class="tkgm-popup-row"><span>İl / İlçe:</span><b>${ilAd || ilceAd ? ilAd + ' / ' + ilceAd : '-'}</b></div>
        <div class="tkgm-popup-row"><span>Mahalle:</span><b>${mahalle}</b></div>
        <div class="tkgm-popup-row"><span>Ada / Parsel:</span><b style="color: #dc2626; font-size: 14px;">${ada} / ${parsel}</b></div>
        <div class="tkgm-popup-row"><span>Alan:</span><b>${formattedAlan ? formattedAlan + ' m²' : '-'}</b></div>
        <div class="tkgm-popup-row"><span>Nitelik:</span><b>${p.nitelik || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Mevkii:</span><b>${p.mevki || p.mevkii || '-'}</b></div>
        <div class="tkgm-popup-row"><span>Pafta:</span><b>${p.pafta || '-'}</b></div>

        <!-- İndirme Bölümü -->
        <div class="export-section">
          <span class="export-title">📥 Dışa Aktar & İndir</span>
          <div class="export-btn-group">
            <button class="export-btn export-btn-kml" onclick="downloadKML()">
              🌍 KML İndir
            </button>
            <button class="export-btn export-btn-txt" onclick="downloadTXT()">
              📄 Koordinat (TXT)
            </button>
            <button class="export-btn export-btn-dxf" onclick="downloadDXF()">
              ⬇ DXF İndir (AutoCAD / Netcad)
            </button>
          </div>
          <div class="export-note">
            AutoCAD, Netcad ve Google Earth ile %100 uyumludur. Koordinatlar TKGM açık servisinden üretilir.
          </div>
        </div>
      `;
      detailModal.style.display = 'block';
    };

    // --- KOORDİNATLARI ÇIKARMA YARDIMCISI ---
    function extractCoordinates(geojson) {
      if (!geojson) return [];
      const geom = geojson.geometry || (geojson.features && geojson.features[0] ? geojson.features[0].geometry : null);
      if (!geom) return [];

      let coords = [];
      if (geom.type === 'Polygon') {
        coords = geom.coordinates[0]; // Dış halka [[lng, lat], ...]
      } else if (geom.type === 'MultiPolygon') {
        coords = geom.coordinates[0][0];
      }
      return coords;
    }

    // --- ENLEM & BOYLAM SIRASINI OTOMATİK NORMALİZE EDİCİ ---
    // TKGM veya GeoJSON'dan gelen nokta dizisinde (c[0], c) hangisinin boylam, hangisinin enlem olduğunu garantiye alır.
    // Türkiye Sınırları: Enlem ~35.8 - 42.2° N | Boylam ~25.7 - 44.8° E
    function normalizePoint(c) {
      const p0 = Number(c[0]);
      const p1 = Number(c);

      // p0 35.5-42.5 arasında ve p1 25.0-35.5 arasında ise (İstanbul, Ankara, İzmir vb. Batı ve Orta Türkiye):
      // p0 ENLEM, p1 BOYLAM'dır!
      if (p0 >= 35.5 && p0 <= 42.5 && p1 >= 25.0 && p1 < 35.5) {
        return { lat: p0, lon: p1 };
      }
      // p1 35.5-42.5 arasında ve p0 25.0-35.5 arasında ise:
      // p0 BOYLAM, p1 ENLEM'dir (standart GeoJSON).
      if (p1 >= 35.5 && p1 <= 42.5 && p0 >= 25.0 && p0 < 35.5) {
        return { lat: p1, lon: p0 };
      }
      // Genel durum: GeoJSON varsayılanı c[0] boylam, c enlem
      return { lat: p1, lon: p0 };
    }

    // --- XML GÜVENLİ KAÇIŞ YARDIMCISI (&, <, > işaretlerini escape eder) ---
    function escapeXml(unsafe) {
      return (unsafe || '').toString().replace(/[<>&'"]/g, function (c) {
        switch (c) {
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '&': return '&amp;';
          case '\'': return '&apos;';
          case '"': return '&quot;';
        }
      });
    }

    // --- DOSYA İNDİRME TETİKLEYİCİSİ ---
    function triggerDownload(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- 1. KML İNDİR (Antarktika Hatası Düzeltildi - Referans Dosyayla Birebir) ---
    window.downloadKML = function() {
      if (!currentActiveParcel) return;
      const { props, geojson } = currentActiveParcel;
      const coords = extractCoordinates(geojson);
      if (!coords.length) { alert('Koordinat bilgisi bulunamadı.'); return; }

      const ada = props.adaNo || props.ada || '0';
      const parsel = props.parselNo || props.parsel || '0';
      const mahalle = props.mahalleAd || props.mahalle || '';
      const ilAd = props.ilAd || '';
      const ilceAd = props.ilceAd || '';
      const nitelik = props.nitelik || 'Arsa';
      const pafta = props.pafta || '';
      const alan = formatAlan(props.alan || props.yuzolcumu || '');

      // Koordinatları kesin olarak {lat, lon} şeklinde normalize et
      let normCoords = coords.map(normalizePoint);

      // KML LinearRing poligonunun kapalı olması zorunludur (ilk nokta sonda tekrarlanır)
      const first = normCoords[0];
      const last = normCoords[normCoords.length - 1];
      if (Math.abs(first.lat - last.lat) > 0.000001 || Math.abs(first.lon - last.lon) > 0.000001) {
        normCoords.push(first);
      }

      // KML Standardı: KESİNLİKLE boylam,enlem,0 (lon,lat,0)
      const kmlCoordString = normCoords.map(pt => `${pt.lon.toFixed(5)},${pt.lat.toFixed(5)},0`).join(' ');

      // Açıklama metni
      let descParts = [];
      if (nitelik && alan) {
        descParts.push(`${nitelik} — ${alan} m² (tapu alanı)`);
      } else if (alan) {
        descParts.push(`${alan} m² (tapu alanı)`);
      } else if (nitelik) {
        descParts.push(nitelik);
      }

      if (ilAd || ilceAd) {
        descParts.push(`${ilAd}/${ilceAd}`);
      }

      if (pafta) {
        descParts.push(`pafta ${pafta}`);
      }

      const description = escapeXml(descParts.join(' · '));
      const placemarkName = escapeXml(`${mahalle} ${ada}/${parsel}`.trim());

      // Referans KML ile %100 Birebir XML
      const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>Parsel sınırları</name>
<Style id="parsel"><LineStyle><color>ff5a7f1a</color><width>2.5</width></LineStyle><PolyStyle><color>405a7f1a</color></PolyStyle></Style>
<Placemark><name>${placemarkName}</name><description>${description}</description><styleUrl>#parsel</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${kmlCoordString}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>
</Document></kml>`;

      const filename = `${makeSlug(ilAd, ilceAd, mahalle, ada, parsel)}.kml`;
      triggerDownload(kmlContent, filename, 'application/vnd.google-earth.kml+xml');
    };

    // --- YARDIMCI 1: ASCII Dönüştürücü (TXT ve DXF için) ---
    function toAscii(str) {
      return (str || '')
        .toString()
        .replace(/İ/g, 'I').replace(/ı/g, 'i')
        .replace(/Ğ/g, 'G').replace(/ğ/g, 'g')
        .replace(/Ü/g, 'U').replace(/ü/g, 'u')
        .replace(/Ş/g, 'S').replace(/ş/g, 's')
        .replace(/Ö/g, 'O').replace(/ö/g, 'o')
        .replace(/Ç/g, 'C').replace(/ç/g, 'c')
        .replace(/²/g, '2');
    }

    // --- YARDIMCI 2: Dosya Adı Oluşturucu (istanbul_pendik_seyhli_ada7296_parsel14) ---
    function makeSlug(il, ilce, mahalle, ada, parsel) {
      function clean(str) {
        return (str || '')
          .toString()
          .replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
          .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
          .replace(/Ü/g, 'u').replace(/ü/g, 'u')
          .replace(/Ş/g, 's').replace(/ş/g, 's')
          .replace(/Ö/g, 'o').replace(/ö/g, 'o')
          .replace(/Ç/g, 'c').replace(/ç/g, 'c')
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '_')
          .replace(/_+/g, '_')
          .replace(/^_|_$/g, '');
      }
      const parts = [clean(il), clean(ilce), clean(mahalle), `ada${ada}`, `parsel${parsel}`].filter(Boolean);
      return parts.join('_');
    }

    // --- YARDIMCI 3: WGS84 -> TÜRKİYE ED50 / UTM (6° Dilim) Metre Dönüşümü ---
    function wgs84ToED50UTM(lat, lon) {
      const a_wgs = 6378137.0;
      const f_wgs = 1.0 / 298.257223563;
      const a_ed = 6378388.0;
      const f_ed = 1.0 / 297.0;

      const dx = -87.0;
      const dy = -98.0;
      const dz = -121.0;

      const b_wgs = a_wgs * (1.0 - f_wgs);
      const e2_wgs = (a_wgs * a_wgs - b_wgs * b_wgs) / (a_wgs * a_wgs);

      const da = a_ed - a_wgs;
      const df = f_ed - f_wgs;

      const phi = lat * Math.PI / 180.0;
      const lam = lon * Math.PI / 180.0;
      const sinPhi = Math.sin(phi);
      const cosPhi = Math.cos(phi);
      const sinLam = Math.sin(lam);
      const cosLam = Math.cos(lam);

      const Rn = a_wgs / Math.sqrt(1.0 - e2_wgs * sinPhi * sinPhi);
      const Rm = a_wgs * (1.0 - e2_wgs) / Math.pow(1.0 - e2_wgs * sinPhi * sinPhi, 1.5);

      const dPhi = (-dx * sinPhi * cosLam - dy * sinPhi * sinLam + dz * cosPhi + (Rn * e2_wgs * sinPhi * cosPhi / a_wgs) * da + sinPhi * cosPhi * (Rm * a_wgs / b_wgs + Rn * b_wgs / a_wgs) * df) / Rm;
      const dLam = (-dx * sinLam + dy * cosLam) / (Rn * cosPhi);

      const lat_ed = lat + dPhi * 180.0 / Math.PI;
      const lon_ed = lon + dLam * 180.0 / Math.PI;

      const zone = Math.floor((lon + 180.0) / 6.0) + 1;
      const lon0 = ((zone - 1) * 6.0 - 180.0 + 3.0) * Math.PI / 180.0;
      const phi_ed = lat_ed * Math.PI / 180.0;
      const lam_ed = lon_ed * Math.PI / 180.0;

      const a = 6378388.0;
      const f = 1.0 / 297.0;
      const k0 = 0.9996;
      const e2 = 2.0 * f - f * f;
      const ep2 = e2 / (1.0 - e2);

      const N = a / Math.sqrt(1.0 - e2 * Math.sin(phi_ed) * Math.sin(phi_ed));
      const T = Math.tan(phi_ed) * Math.tan(phi_ed);
      const C = ep2 * Math.cos(phi_ed) * Math.cos(phi_ed);
      const A = Math.cos(phi_ed) * (lam_ed - lon0);

      const M = a * ((1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0) * phi_ed - (3.0 * e2 / 8.0 + 3.0 * e2 * e2 / 32.0 + 45.0 * e2 * e2 * e2 / 1024.0) * Math.sin(2.0 * phi_ed) + (15.0 * e2 * e2 / 256.0 + 45.0 * e2 * e2 * e2 / 1024.0) * Math.sin(4.0 * phi_ed) - (35.0 * e2 * e2 * e2 / 3072.0) * Math.sin(6.0 * phi_ed));

      const easting = k0 * N * (A + (1.0 - T + C) * Math.pow(A, 3) / 6.0 + (5.0 - 18.0 * T + T * T + 72.0 * C - 58.0 * ep2) * Math.pow(A, 5) / 120.0) + 500000.0;
      const northing = k0 * (M + N * Math.tan(phi_ed) * (A * A / 2.0 + (5.0 - T + 9.0 * C + 4.0 * C * C) * Math.pow(A, 4) / 24.0 + (61.0 - 58.0 * T + T * T + 600.0 * C - 330.0 * ep2) * Math.pow(A, 6) / 720.0));

      return { y: easting, x: northing, zone: zone };
    }

    // =========================================================================
    // 2. KOORDİNAT (TXT) İNDİRME FONKSİYONU
    // =========================================================================
    window.downloadTXT = function() {
      if (!currentActiveParcel) return;
      const { props, geojson } = currentActiveParcel;
      const coords = extractCoordinates(geojson);
      if (!coords.length) { alert('Koordinat bilgisi bulunamadı.'); return; }

      const ada = props.adaNo || props.ada || '0';
      const parsel = props.parselNo || props.parsel || '0';
      const mahalle = toAscii(props.mahalleAd || props.mahalle || 'Parsel');
      const ilAd = props.ilAd || '';
      const ilceAd = props.ilceAd || '';
      const alan = toAscii(formatAlan(props.alan || props.yuzolcumu || ''));

      let normCoords = coords.map(normalizePoint);
      // TXT'de son nokta mükerrer yazılmaz (tekil noktalar listesi)
      if (normCoords.length > 1) {
        const f = normCoords[0], l = normCoords[normCoords.length - 1];
        if (Math.abs(f.lat - l.lat) < 0.000001 && Math.abs(f.lon - l.lon) < 0.000001) {
          normCoords.pop();
        }
      }

      // Zon belirleme
      const firstPt = wgs84ToED50UTM(normCoords[0].lat, normCoords[0].lon);
      const zone = firstPt.zone;

      // Örnek dosyanın birebir başlık ve satır formatı
      let txt = `# arsayadair.com - parsel kose koordinatlari\n`;
      txt += `# Sistem: ED50 / UTM Zon ${zone} (6 derecelik dilim)\n`;
      txt += `# Sutunlar: NoktaNo Y(Dogu) X(Kuzey) Z\n`;
      txt += `# TKGM halka acik verisi ~1 m cozunurlukludur; resmi olcu yerine gecmez.\n\n`;
      txt += `# ${mahalle} ${ada}/${parsel} - ${alan} m2 (tapu alani)\n`;

      normCoords.forEach((pt, idx) => {
        const utm = wgs84ToED50UTM(pt.lat, pt.lon);
        txt += `${idx + 1} ${utm.y.toFixed(3)} ${utm.x.toFixed(3)} 0.000\n`;
      });

      const filename = `${makeSlug(ilAd, ilceAd, props.mahalleAd, ada, parsel)}.txt`;
      triggerDownload(txt, filename, 'text/plain;charset=utf-8');
    };

    // =========================================================================
    // 3. DXF İNDİR (AutoCAD / Netcad R12 AC1009 Formatı - Örnekle Birebir)
    // =========================================================================
    window.downloadDXF = function() {
      if (!currentActiveParcel) return;
      const { props, geojson } = currentActiveParcel;
      const coords = extractCoordinates(geojson);
      if (!coords.length) { alert('Koordinat bilgisi bulunamadı.'); return; }

      const ada = props.adaNo || props.ada || '0';
      const parsel = props.parselNo || props.parsel || '0';
      const mahalle = toAscii(props.mahalleAd || props.mahalle || 'Parsel');
      const ilAd = props.ilAd || '';
      const ilceAd = props.ilceAd || '';
      const alan = toAscii(formatAlan(props.alan || props.yuzolcumu || ''));

      let normCoords = coords.map(normalizePoint);
      // Kapalı polylinede son nokta tekilleştirilir (AutoCAD kapalı polyline bayrağı otomatik bağlar)
      if (normCoords.length > 1) {
        const f = normCoords[0], l = normCoords[normCoords.length - 1];
        if (Math.abs(f.lat - l.lat) < 0.000001 && Math.abs(f.lon - l.lon) < 0.000001) {
          normCoords.pop();
        }
      }

      // Koordinatları ED50 / UTM metre bazlı hesapla
      const utmPts = normCoords.map(pt => wgs84ToED50UTM(pt.lat, pt.lon));

      // Sınır değerleri (EXTMIN / EXTMAX / LIMMIN / LIMMAX)
      const xs = utmPts.map(p => p.y);
      const ys = utmPts.map(p => p.x);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);

      const centerX = (minX + maxX) / 2.0;
      const centerY = (minY + maxY) / 2.0;
      const height = Math.max(maxY - minY, maxX - minX, 100.0);

      // Referans DXF dosyasının birebir AC1009 R12 şablonu
      let dxf = `0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n`;
      dxf += `9\n$EXTMIN\n10\n${minX.toFixed(3)}\n20\n${minY.toFixed(3)}\n30\n0.0\n`;
      dxf += `9\n$EXTMAX\n10\n${maxX.toFixed(3)}\n20\n${maxY.toFixed(3)}\n30\n0.0\n`;
      dxf += `9\n$LIMMIN\n10\n${minX.toFixed(3)}\n20\n${minY.toFixed(3)}\n`;
      dxf += `9\n$LIMMAX\n10\n${maxX.toFixed(3)}\n20\n${maxY.toFixed(3)}\n0\nENDSEC\n`;

      dxf += `0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nVPORT\n70\n1\n0\nVPORT\n2\n*ACTIVE\n70\n0\n`;
      dxf += `10\n0.0\n20\n0.0\n11\n1.0\n21\n1.0\n12\n${centerX.toFixed(3)}\n22\n${centerY.toFixed(3)}\n`;
      dxf += `13\n0.0\n23\n0.0\n14\n1.0\n24\n1.0\n15\n0.0\n25\n0.0\n16\n0.0\n26\n0.0\n36\n1.0\n`;
      dxf += `17\n0.0\n27\n0.0\n37\n0.0\n40\n${height.toFixed(3)}\n41\n1.8\n42\n50.0\n43\n0.0\n44\n0.0\n50\n0.0\n51\n0.0\n`;
      dxf += `71\n0\n72\n100\n73\n1\n74\n3\n75\n0\n76\n0\n77\n0\n78\n0\n0\nENDTAB\n`;

      // Katmanlar: PARSEL (Yeşil: 3), YAZI (Sarı: 2)
      dxf += `0\nTABLE\n2\nLAYER\n70\n2\n`;
      dxf += `0\nLAYER\n2\nPARSEL\n70\n0\n62\n3\n6\nCONTINUOUS\n`;
      dxf += `0\nLAYER\n2\nYAZI\n70\n0\n62\n2\n6\nCONTINUOUS\n`;
      dxf += `0\nENDTAB\n0\nENDSEC\n`;

      dxf += `0\nSECTION\n2\nENTITIES\n`;

      // Kapalı Parsel Poligonu (70: 1 kapalı polyline)
      dxf += `0\nPOLYLINE\n8\nPARSEL\n66\n1\n70\n1\n`;
      utmPts.forEach(p => {
        dxf += `0\nVERTEX\n8\nPARSEL\n10\n${p.y.toFixed(3)}\n20\n${p.x.toFixed(3)}\n30\n0.0\n`;
      });
      dxf += `0\nSEQEND\n`;

      // Parselin tam ortasındaki iki satır yazı
      const text1Y = centerY + 3.75;
      const text2Y = centerY - 3.75;

      dxf += `0\nTEXT\n8\nYAZI\n10\n${centerX.toFixed(3)}\n20\n${text1Y.toFixed(3)}\n30\n0.0\n40\n5.00\n1\n${mahalle} ${ada}/${parsel}\n72\n1\n73\n2\n11\n${centerX.toFixed(3)}\n21\n${text1Y.toFixed(3)}\n31\n0.0\n`;
      dxf += `0\nTEXT\n8\nYAZI\n10\n${centerX.toFixed(3)}\n20\n${text2Y.toFixed(3)}\n30\n0.0\n40\n5.00\n1\n${alan} m2\n72\n1\n73\n2\n11\n${centerX.toFixed(3)}\n21\n${text2Y.toFixed(3)}\n31\n0.0\n`;

      dxf += `0\nENDSEC\n0\nEOF\n`;

      const filename = `${makeSlug(ilAd, ilceAd, props.mahalleAd, ada, parsel)}.dxf`;
      triggerDownload(dxf, filename, 'application/dxf');
    };

    // 9. Arama Butonu ile Sorgulama
    btnSorgula.addEventListener('click', async () => {
      const mahalleId = mahalleSelect.value;
      const ada = adaInput.value.trim() || '0';
      const parsel = parselInput.value.trim();

      if (!mahalleId || !parsel) {
        alert('Lütfen Mahalle ve Parsel numarasını giriniz.');
        return;
      }

      btnSorgula.innerText = 'Sorgulanıyor...';
      btnSorgula.disabled = true;

      try {
        const path = (ada === "0" || ada === "") ? `${TKGM_API}/parsel/${mahalleId}/${parsel}` : `${TKGM_API}/parsel/${mahalleId}/${ada}/${parsel}`;
        const res = await fetch(path, { referrerPolicy: 'no-referrer' });
        if (!res.ok) throw new Error('Parsel bulunamadı');
        const data = await res.json();

        const props = renderParcel(data, true);
        if (props) {
          window.showParcelDetails(props, data);
        }
      } catch (err) {
        alert('Aradığınız parsel bilgisi bulunamadı veya bu parsel mevcut değil.');
      } finally {
        btnSorgula.innerText = '🔍 Parseli Sorgula';
        btnSorgula.disabled = false;
      }
    });

    // 10. Haritadan Tıklama (Tırnak çakışmasından arındırılmış güvenli yapı)
    map.on('click', async (e) => {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);

      if (clickMarker) map.removeLayer(clickMarker);

      clickMarker = L.marker(e.latlng).addTo(map);
      clickMarker.bindPopup(`
        <div class="tkgm-popup">
          <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
          <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
          <div style="color: #64748b; font-size: 11px; margin-top: 4px;">Sınırlar tespit ediliyor...</div>
        </div>
      `, { autoPan: false }).openPopup();

      try {
        const res = await fetch(`${TKGM_API}/parsel/${lat}/${lng}`, { referrerPolicy: 'no-referrer' });
        if (!res.ok) throw new Error();
        const data = await res.json();

        const props = renderParcel(data, false);
        lastClickedParcelData = { props: props, data: data };

        clickMarker.setPopupContent(`
          <div class="tkgm-popup">
            <div class="tkgm-popup-row"><span>Ada / Parsel:</span><b style="color: #dc2626;">${props.adaNo || props.ada || '0'} / ${props.parselNo || props.parsel || '-'}</b></div>
            <div class="tkgm-popup-row"><span>Mahalle:</span><b>${props.mahalleAd || '-'}</b></div>
            <button class="tkgm-popup-btn" onclick='window.showParcelDetails(lastClickedParcelData.props, lastClickedParcelData.data)'>
              📋 Detayları Görüntüle
            </button>
          </div>
        `).openPopup();
      } catch (err) {
        clickMarker.setPopupContent(`
          <div class="tkgm-popup">
            <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
            <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
            <div style="color: #dc2626; font-size: 11px; margin-top: 4px;">Bu noktada parsel bulunamadı.</div>
          </div>
        `).openPopup();
      }
    });

    // 11. Temizleme Butonu
    btnClear.addEventListener('click', () => {
      parcelLayerGroup.clearLayers();
      adminBoundaryGroup.clearLayers();
      drawnParcelsMap.clear();
      currentActiveParcel = null;
      lastClickedParcelData = null;
      if (clickMarker) map.removeLayer(clickMarker);
      detailModal.style.display = 'none';
    });
  </script>
</body>
