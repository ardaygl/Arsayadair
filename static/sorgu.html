<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ada / Parsel ve Konum Sorgula | Arsaya Dair</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background-color: #f8fafc; }
    #sidebar { width: 380px; height: 100%; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 1000; overflow-y: auto; }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; background: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { font-size: 1.1rem; font-weight: 600; }
    .back-btn { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    .back-btn:hover { color: #ffffff; }
    .panel-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    
    .hint-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px 12px; font-size: 0.8rem; color: #1e40af; line-height: 1.4; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; font-weight: 600; color: #475569; }
    select, input { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; background: #ffffff; }
    select:focus, input:focus { border-color: #990022; }
    select:disabled, input:disabled { background: #f1f5f9; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .submit-btn { padding: 11px; background: #990022; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .submit-btn:hover { background: #7a001b; }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .clear-btn { padding: 9px; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .clear-btn:hover { background: #e2e8f0; color: #0f172a; }

    #info-card { display: none; border-top: 2px solid #990022; padding: 18px 20px; background: #f8fafc; }
    #info-card h3 { font-size: 0.95rem; margin-bottom: 12px; color: #0f172a; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 0.82rem; }
    .info-item span:first-child { color: #64748b; display: block; font-size: 0.75rem; }
    .info-item span:last-child { font-weight: 600; color: #1e293b; }
    
    #map { flex: 1; height: 100%; }

    /* ORİJİNAL TKGM ADA/PARSEL YAZI STİLİ */
    .tkgm-parsel-yazi {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 15px !important;
      letter-spacing: 0.5px !important;
      text-shadow: 
        -1.5px -1.5px 0 #000,  
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0px 0px 4px rgba(0,0,0,0.9) !important;
      pointer-events: none !important;
      white-space: nowrap !important;
      padding: 0 !important;
    }
    .tkgm-parsel-yazi::before {
      display: none !important;
    }

    /* ENLEM / BOYLAM BALONCUĞU */
    .tkgm-popup {
      font-family: system-ui, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 2px;
      min-width: 160px;
    }
    .tkgm-popup-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      color: #334155;
    }
    .tkgm-popup-btn {
      width: 100%;
      margin-top: 6px;
      background: #990022;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .tkgm-popup-btn:hover {
      background: #7a001b;
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="panel-header">
      <h2>Parsel Sorgulama</h2>
      <a href="/" class="back-btn">← Menü</a>
    </div>

    <div class="panel-body">
      <div class="hint-box">
        💡 <b>İpucu:</b> Harita doğrudan <b>yüksek çözünürlüklü uydu görüntüsüyle</b> açılır. İstediğiniz kadar yakınlaşabilirsiniz; görüntü bozulmaz.
      </div>

      <div class="form-group">
        <label for="ilSelect">İl</label>
        <select id="ilSelect">
          <option value="">İller Yükleniyor...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ilceSelect">İlçe</label>
        <select id="ilceSelect" disabled>
          <option value="">Önce İl Seçiniz</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mahalleSelect">Mahalle</label>
        <select id="mahalleSelect" disabled>
          <option value="">Önce İlçe Seçiniz</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="adaInput">Ada</label>
          <input type="text" id="adaInput" placeholder="Örn: 101" disabled />
        </div>
        <div class="form-group">
          <label for="parselInput">Parsel</label>
          <input type="text" id="parselInput" placeholder="Örn: 5" disabled />
        </div>
      </div>

      <div class="btn-group">
        <button id="sorgulaBtn" class="submit-btn" disabled>Parseli Sorgula</button>
        <button id="temizleBtn" class="clear-btn" type="button">🗑️ Haritadaki Parselleri Temizle</button>
      </div>
    </div>

    <div id="info-card">
      <h3>Parsel Detayları</h3>
      <div class="info-grid">
        <div class="info-item"><span>İl</span><span id="info-il">-</span></div>
        <div class="info-item"><span>İlçe</span><span id="info-ilce">-</span></div>
        <div class="info-item"><span>Mahalle</span><span id="info-mahalle">-</span></div>
        <div class="info-item"><span>Ada / Parsel</span><span id="info-adaparsel">-</span></div>
        <div class="info-item"><span>Alan</span><span id="info-alan">-</span></div>
        <div class="info-item"><span>Nitelik</span><span id="info-nitelik">-</span></div>
        <div class="info-item"><span>Pafta</span><span id="info-pafta">-</span></div>
        <div class="info-item"><span>Mevkii</span><span id="info-mevkii">-</span></div>
      </div>
    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Haritayı oluştur (Maksimum zoom seviyesi 21 yapıldı)
    const map = L.map('map', { 
      zoomControl: false,
      maxZoom: 21
    }).setView([39.0, 35.0], 6);
    
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 1. Google Hibrit Uydu (En yüksek çözünürlük + sokak isimleri + zoom 21'e kadar kusursuz) -> VARSAYILAN OLARAK EKLENDİ
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 21,
      maxNativeZoom: 20,
      attribution: '&copy; Google Maps'
    }).addTo(map);

    // 2. Esri Uydu (maxNativeZoom: 18 eklendi, böylece 18'den sonra 'data not available' yazmaz, görüntüyü büyüterek devam eder)
    const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 21,
      maxNativeZoom: 18,
      attribution: '&copy; Esri World Imagery'
    });

    // 3. Standart Sokak Haritası
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 21,
      maxNativeZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    L.control.layers({
      "Google Uydu (Hibrit)": googleHybrid,
      "Esri Uydu": esri,
      "Sokak Haritası (OSM)": osm
    }, null, { position: 'topright' }).addTo(map);

    const adminBoundaryGroup = L.featureGroup().addTo(map);
    const parcelsGroup = L.featureGroup().addTo(map);
    let clickMarker = null;

    const ilSelect = document.getElementById('ilSelect');
    const ilceSelect = document.getElementById('ilceSelect');
    const mahalleSelect = document.getElementById('mahalleSelect');
    const adaInput = document.getElementById('adaInput');
    const parselInput = document.getElementById('parselInput');
    const sorgulaBtn = document.getElementById('sorgulaBtn');
    const temizleBtn = document.getElementById('temizleBtn');
    const infoCard = document.getElementById('info-card');

    let ilceFeaturesMap = {};
    let mahalleFeaturesMap = {};

    async function zoomAndDrawBoundary(query, fallbackGeometry = null, color = '#f59e0b') {
      adminBoundaryGroup.clearLayers();

      if (fallbackGeometry) {
        const layer = L.geoJSON(fallbackGeometry, {
          style: { color: color, weight: 2, dashArray: '5, 5', fillColor: color, fillOpacity: 0.05 }
        }).addTo(adminBoundaryGroup);
        map.fitBounds(layer.getBounds(), { padding: [30, 30] });
        return;
      }

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ', Türkiye')}&format=geojson&polygon_geojson=1&limit=1`);
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          const layer = L.geoJSON(data.features[0], {
            style: { color: color, weight: 2, dashArray: '5, 5', fillColor: color, fillOpacity: 0.05 }
          }).addTo(adminBoundaryGroup);
          map.fitBounds(layer.getBounds(), { padding: [30, 30] });
        }
      } catch (e) {
        console.warn("Sınır çekilemedi:", e);
      }
    }

    async function loadIller() {
      try {
        const res = await fetch('/api/iller');
        const iller = await res.json();
        ilSelect.innerHTML = '<option value="">İl Seçiniz...</option>';
        iller.forEach(il => {
          const opt = document.createElement('option');
          opt.value = il.id;
          opt.textContent = il.ad;
          ilSelect.appendChild(opt);
        });
      } catch (err) {
        ilSelect.innerHTML = '<option value="">İller Yüklenemedi</option>';
      }
    }
    loadIller();

    ilSelect.addEventListener('change', async () => {
      const ilId = ilSelect.value;
      const ilAd = ilSelect.options[ilSelect.selectedIndex]?.text;

      resetSelect(ilceSelect, 'İlçe Yükleniyor...');
      resetSelect(mahalleSelect, 'Önce İlçe Seçiniz');
      toggleInputs(false);

      if (!ilId) {
        adminBoundaryGroup.clearLayers();
        return resetSelect(ilceSelect, 'Önce İl Seçiniz');
      }

      zoomAndDrawBoundary(ilAd, null, '#f59e0b');

      try {
        const res = await fetch(`/api/ilceler/${ilId}`);
        const ilceler = await res.json();
        ilceSelect.innerHTML = '<option value="">İlçe Seçiniz...</option>';
        ilceSelect.disabled = false;
        ilceFeaturesMap = {};
        ilceler.forEach(ilce => {
          const opt = document.createElement('option');
          opt.value = ilce.id;
          opt.textContent = ilce.ad;
          ilceSelect.appendChild(opt);
          if (ilce.geometry) ilceFeaturesMap[ilce.id] = ilce.geometry;
        });
      } catch (e) {
        resetSelect(ilceSelect, 'İlçeler Yüklenemedi');
      }
    });

    ilceSelect.addEventListener('change', async () => {
      const ilceId = ilceSelect.value;
      const ilceAd = ilceSelect.options[ilceSelect.selectedIndex]?.text;
      const ilAd = ilSelect.options[ilSelect.selectedIndex]?.text;

      resetSelect(mahalleSelect, 'Mahalle Yükleniyor...');
      toggleInputs(false);

      if (!ilceId) return resetSelect(mahalleSelect, 'Önce İlçe Seçiniz');

      const geom = ilceFeaturesMap[ilceId] || null;
      zoomAndDrawBoundary(`${ilceAd}, ${ilAd}`, geom, '#ec4899');

      try {
        const res = await fetch(`/api/mahalleler/${ilceId}`);
        const mahalleler = await res.json();
        mahalleSelect.innerHTML = '<option value="">Mahalle Seçiniz...</option>';
        mahalleSelect.disabled = false;
        mahalleFeaturesMap = {};
        mahalleler.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.ad;
          mahalleSelect.appendChild(opt);
          if (m.geometry) mahalleFeaturesMap[m.id] = m.geometry;
        });
      } catch (e) {
        resetSelect(mahalleSelect, 'Mahalleler Yüklenemedi');
      }
    });

    mahalleSelect.addEventListener('change', () => {
      const mahalleId = mahalleSelect.value;
      const mahalleAd = mahalleSelect.options[mahalleSelect.selectedIndex]?.text;
      const ilceAd = ilceSelect.options[ilceSelect.selectedIndex]?.text;
      const ilAd = ilSelect.options[ilSelect.selectedIndex]?.text;

      toggleInputs(!!mahalleId);

      if (mahalleId) {
        const geom = mahalleFeaturesMap[mahalleId] || null;
        zoomAndDrawBoundary(`${mahalleAd}, ${ilceAd}, ${ilAd}`, geom, '#06b6d4');
      }
    });

    function resetSelect(el, txt) { el.innerHTML = `<option value="">${txt}</option>`; el.disabled = true; }
    function toggleInputs(en) { adaInput.disabled = !en; parselInput.disabled = !en; sorgulaBtn.disabled = !en; }

    temizleBtn.addEventListener('click', () => {
      parcelsGroup.clearLayers();
      if (clickMarker) map.removeLayer(clickMarker);
      infoCard.style.display = 'none';
    });

    window.showParcelDetails = function(p) {
      const ada = p.adaNo || p.ada || '-';
      const parsel = p.parselNo || p.parsel || '-';

      document.getElementById('info-il').textContent = p.ilAd || ilSelect.options[ilSelect.selectedIndex]?.text || '-';
      document.getElementById('info-ilce').textContent = p.ilceAd || ilceSelect.options[ilceSelect.selectedIndex]?.text || '-';
      document.getElementById('info-mahalle').textContent = p.mahalleAd || mahalleSelect.options[mahalleSelect.selectedIndex]?.text || '-';
      document.getElementById('info-adaparsel').textContent = `${ada} / ${parsel}`;
      document.getElementById('info-alan').textContent = p.alan ? `${p.alan} m²` : '-';
      document.getElementById('info-nitelik').textContent = p.nitelik || '-';
      document.getElementById('info-pafta').textContent = p.pafta || '-';
      document.getElementById('info-mevkii').textContent = p.mevkii || '-';
      
      infoCard.style.display = 'block';

      if (p.adaNo) adaInput.value = p.adaNo;
      if (p.parselNo) parselInput.value = p.parselNo;
    };

    function addParcelToMap(data, autoOpen = false) {
      const feature = data.type === "FeatureCollection" ? data.features[0] : (data.geometry ? data : null);
      if (!feature || !feature.geometry) return null;

      const p = feature.properties || {};
      const ada = p.adaNo || p.ada || adaInput.value || '0';
      const parsel = p.parselNo || p.parsel || parselInput.value || '';
      
      const labelText = (ada && ada !== '0') ? `${ada}/${parsel}` : `${parsel}`;

      const polygonLayer = L.geoJSON(feature, {
        style: {
          color: '#990022',
          weight: 2.5,
          fillColor: '#990022',
          fillOpacity: 0.22
        }
      }).addTo(parcelsGroup);

      polygonLayer.bindTooltip(labelText, {
        permanent: true,
        direction: 'center',
        className: 'tkgm-parsel-yazi'
      });

      if (autoOpen) {
        map.fitBounds(polygonLayer.getBounds(), { padding: [50, 50] });
        window.showParcelDetails(p);
      }

      return { polygonLayer, p };
    }

    sorgulaBtn.addEventListener('click', async () => {
      const mahalleId = mahalleSelect.value;
      const ada = adaInput.value.trim() || "0";
      const parsel = parselInput.value.trim();

      if (!parsel) return alert("Lütfen parsel numarasını giriniz.");

      sorgulaBtn.disabled = true;
      sorgulaBtn.textContent = "Sorgulanıyor...";

      try {
        const res = await fetch(`/api/parsel/${mahalleId}/${ada}/${parsel}`);
        if (!res.ok) throw new Error("Parsel bulunamadı.");
        const data = await res.json();
        addParcelToMap(data, true);
      } catch (err) {
        alert(err.message);
      } finally {
        sorgulaBtn.disabled = false;
        sorgulaBtn.textContent = "Parseli Sorgula";
      }
    });

    map.on('click', async (e) => {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);

      if (clickMarker) map.removeLayer(clickMarker);

      clickMarker = L.marker(e.latlng).addTo(map);

      clickMarker.bindPopup(`
        <div class="tkgm-popup">
          <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
          <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
          <div style="color: #64748b; font-size: 11px; margin-top: 4px;">Sınırlar tespit ediliyor...</div>
        </div>
      `).openPopup();

      try {
        const res = await fetch(`/api/parsel-nokta/${lat}/${lng}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        const result = addParcelToMap(data, false);
        if (result) {
          clickMarker.setPopupContent(`
            <div class="tkgm-popup">
              <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
              <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
              <button class="tkgm-popup-btn" onclick="window.showParcelDetails(${JSON.stringify(result.p).replace(/"/g, '&quot;')})">
                📋 Parsel Detaylarını Gör
              </button>
            </div>
          `).openPopup();
        }
      } catch (err) {
        clickMarker.setPopupContent(`
          <div class="tkgm-popup">
            <div class="tkgm-popup-row"><span>Enlem :</span><b>${lat}</b></div>
            <div class="tkgm-popup-row"><span>Boylam:</span><b>${lng}</b></div>
            <div style="color: #dc2626; font-size: 11.5px; margin-top: 4px;">Bu noktada parsel bulunamadı.</div>
          </div>
        `).openPopup();
      }
    });
  </script>
</body>
</html>
